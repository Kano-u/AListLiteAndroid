# ============================================================================
# ② 编译 arm64-v8a 的 release APK（手动触发）
#
# 产出文件：AListLite-v<版本号>-arm64-v8a-release-signed.apk
#           （<版本号> 直接读 app/build.gradle 里的 versionName，
#             当前仓库为 3.0.1-auto7，所以文件名就是
#             AListLite-v3.0.1-auto7-arm64-v8a-release-signed.apk）
#
# 流程：检出代码 → 编译 Go 后端为 AAR → Gradle 打包 release APK
#       → 用你自己的密钥签名 → 上传为可下载的 Artifact
# ============================================================================

name: 2-编译 arm64-v8a APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 1-检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2-准备 Android SDK（提供 apksigner / zipalign）
        uses: android-actions/setup-android@v3

      - name: 3-安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 4-安装 Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.1'
          cache-dependency-path: AListLib/sources/go.sum

      - name: 5-读取 App 版本号
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          if [ -z "$VERSION_NAME" ]; then
            echo "没能从 app/build.gradle 读到 versionName"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "本次构建的 App 版本号：$VERSION_NAME"

      - name: 6-同步 OpenList 版本号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 取 OpenList 最新 release 的版本号（与官方 CI 的做法一致）
          LATEST=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/OpenListTeam/OpenList/releases/latest \
            | grep -o '"tag_name": "[^"]*"' | head -n 1 | cut -d'"' -f4)
          LATEST=${LATEST#v}
          if [ -z "$LATEST" ]; then
            echo "获取 OpenList 版本号失败"
            exit 1
          fi
          echo "OPENLIST_VERSION=$LATEST" >> "$GITHUB_ENV"
          echo "本次内嵌的 OpenList 版本号：$LATEST"
          sed -i "s/\(public static String OPENLIST_VERSION = \"\)\([^\";]*\)\(\";\)/\1$LATEST\3/" \
            app/src/main/java/com/leohao/android/alistlite/util/Constants.java
          grep -n 'OPENLIST_VERSION' app/src/main/java/com/leohao/android/alistlite/util/Constants.java | head -n 2

      - name: 7-恢复已编译的 Go 后端缓存
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: app/libs
          key: alistlib-aar-v1-${{ env.OPENLIST_VERSION }}-${{ hashFiles('AListLib/sources/alistlib/**', 'AListLib/sources/alitvlib/*.go') }}

      - name: 8-编译 OpenList 后端（Go -> AAR，最耗时的一步）
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/AListLib/scripts"
          sh install_alist.sh      # 下载最新 OpenList 源码与前端产物，并打上项目定制补丁
          sh install_gomobile.sh   # 安装 gomobile
          sh build_aar.sh          # gomobile bind 生成 AAR 并复制到 app/libs/
          # 兜底：把生成的所有 AAR 都放进 app/libs（app 里同时用到了 alistlib 和 alitvlib）
          cp -fv "$GITHUB_WORKSPACE/AListLib/sources/"*.aar "$GITHUB_WORKSPACE/app/libs/"

      - name: 9-确认 app/libs 里的 AAR
        run: ls -lh app/libs/

      - name: 10-打包 release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 11-列出 Gradle 产物（便于排查）
        if: always()
        run: ls -lh app/build/outputs/apk/release/ || true

      - name: 12-签名 arm64-v8a APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASS: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "缺少 Secret：ANDROID_SIGNING_KEY（keystore 的 Base64 内容）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "使用 build-tools: $BUILD_TOOLS"

          ls -1 app/build/outputs/apk/release/
          UNSIGNED=$(ls -1 app/build/outputs/apk/release/*arm64-v8a*.apk | grep -v 'signed' | head -n 1)
          echo "未签名 APK: $UNSIGNED"

          OUT="AListLite-v${VERSION_NAME}-arm64-v8a-release-signed.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"

          echo "---- 校验签名 ----"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | head -n 6
          echo "---- 文件信息 ----"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: 13-上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AListLite-v${{ env.VERSION_NAME }}-arm64-v8a-signed
          path: AListLite-v${{ env.VERSION_NAME }}-arm64-v8a-release-signed.apk
          if-no-files-found: error
          retention-days: 30
